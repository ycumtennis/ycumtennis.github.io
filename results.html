<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RESULTS | 横浜市立大学医学部硬式テニス部 OBOG会</title>
<link rel="stylesheet" href="style.css">
<style>
.results-page{--navy:#07192d;--navy2:#0d2d50;--gold:#c6a15b;--line:#dce2e8;--muted:#6b7785;--bg:#f6f8fb;--win:#ad8437;--loss:#7b8692}.results-wrap{max-width:1160px;margin:0 auto}.results-head{display:flex;justify-content:space-between;gap:24px;align-items:end;margin-bottom:28px}.results-head h2{font-size:clamp(38px,5vw,64px);margin:0}.year-select{padding:11px 36px 11px 13px;border:1px solid #ccd4dd;background:#fff;color:var(--navy);font-weight:800}.status{padding:28px;border:1px solid var(--line);background:#fff;color:var(--muted)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 34px}.tab{border:1px solid #cfd6de;background:#fff;color:var(--navy);padding:13px 23px;font-size:12px;font-weight:900;letter-spacing:.12em;cursor:pointer}.tab.active,.tab:hover{background:var(--navy);color:#fff;border-color:var(--navy)}.panel{display:none}.panel.active{display:block}
.latest{background:radial-gradient(circle at 78% 15%,rgba(64,126,178,.36),transparent 36%),linear-gradient(120deg,#061426,#0b2b50 62%,#123d5d);color:#fff;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(320px,.92fr);gap:34px;padding:38px;min-height:350px;margin-bottom:54px}.latest-left{display:flex;flex-direction:column}.latest-meta{font-size:11px;color:#c7d3de;letter-spacing:.15em;font-weight:800}.latest-title{margin-top:44px;font-size:clamp(18px,2.2vw,27px);font-weight:800}.latest-score{font-size:clamp(58px,8vw,104px);line-height:.95;font-weight:900;letter-spacing:-.05em;margin:20px 0}.latest-vs{font-size:clamp(17px,2vw,24px);font-weight:700}.latest-foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.17);padding-top:19px}.latest-foot a{color:#fff;text-decoration:none;font-size:11px;letter-spacing:.12em;font-weight:900}.latest-right{display:flex;flex-direction:column;gap:18px}.badge{align-self:flex-end;padding:8px 15px;font-size:11px;font-weight:900;letter-spacing:.13em;border:1px solid rgba(255,255,255,.35)}.badge.win{background:var(--gold);border-color:var(--gold);color:#07192d}.badge.loss,.badge.sus{background:rgba(255,255,255,.08)}.badge.blank{opacity:0}.thumb{position:relative;display:block;flex:1;min-height:230px;overflow:hidden;background:#0c304f;border:1px solid rgba(255,255,255,.16);color:#fff;text-decoration:none}.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.thumb-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:linear-gradient(to top,rgba(0,0,0,.35),transparent 55%)}.play{width:58px;height:58px;border-radius:50%;background:#fff;color:#07192d;display:flex;align-items:center;justify-content:center;font-size:21px}.thumb-cap{font-size:10px;font-weight:900;letter-spacing:.15em}.no-video{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#b9c7d5;font-size:10px;font-weight:900;letter-spacing:.15em}
.section-block{margin-top:50px}.section-head{border-bottom:1px solid #cbd3dc;padding-bottom:17px;margin-bottom:20px}.section-head small{display:block;color:var(--gold);font-weight:900;letter-spacing:.16em;font-size:10px;margin-bottom:6px}.section-head h3{font-size:clamp(28px,4vw,44px);margin:0}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{border:1px solid var(--line);background:#fff;padding:25px;min-height:235px;display:flex;flex-direction:column}.card-top{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:11px}.card-type{color:var(--gold);font-weight:900;letter-spacing:.08em}.card-round{margin:27px 0 7px;color:var(--muted);font-size:13px}.card-main{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end}.card-home{font-size:21px;font-weight:800}.card-away{font-size:14px;color:var(--muted);margin-top:7px}.card-score{font-size:50px;font-weight:900}.card-foot{margin-top:auto;padding-top:20px;border-top:1px solid #e4e8ed;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:13px}.state{font-size:10px;font-weight:900;letter-spacing:.1em}.state.win{color:var(--win)}.state.loss{color:var(--loss)}.state.sus{color:#9b7b3e}.state.blank{color:transparent}.yt{justify-self:center;text-decoration:none;color:#07192d;font-size:9px;font-weight:900;letter-spacing:.1em}.full{color:#34495e;text-decoration:none;font-size:10px;font-weight:900;letter-spacing:.08em}.practice-row{display:grid;grid-template-columns:110px minmax(180px,1fr) 110px 76px 42px;gap:16px;align-items:center;min-height:74px;padding:0 4px;border-bottom:1px solid var(--line)}.practice-row a{color:inherit;text-decoration:none}.practice-date{font-size:11px;color:var(--muted)}.practice-opp{font-weight:700}.practice-score{font-size:21px;font-weight:900;text-align:center}.obog-grid .card-main{grid-template-columns:1fr auto}.empty{padding:28px;border:1px solid var(--line);background:var(--bg);color:var(--muted)}
@media(max-width:900px){.latest{grid-template-columns:1fr}.cards{grid-template-columns:1fr}}@media(max-width:620px){.results-head{display:block}.year-select{margin-top:14px}.practice-row{grid-template-columns:70px 1fr 62px 46px 32px;gap:8px}.yt span{display:none}.latest{padding:26px}.card{padding:20px}}
</style>
</head>
<body class="results-page">
<header class="site-header scrolled"><div class="container nav"><a class="brand" href="index.html"><small>横浜市立大学</small><strong>医学部硬式テニス部 OBOG会</strong></a><button class="menu-toggle">☰</button><nav class="menu"><a href="index.html">HOME</a><a href="about.html">ABOUT</a><a href="members.html">MEMBERS</a><a class="active" href="results.html">RESULTS</a><a href="schedule.html">SCHEDULE</a><a href="history.html">HISTORY</a><a href="contact.html">CONTACT</a></nav></div></header>
<main>
<section class="page-hero"><div class="container"><div class="kicker">COMPETITION</div><h1>RESULTS</h1><p>男子部・女子部・看護部・OBOG戦の試合結果</p></div></section>
<section class="section"><div class="container results-wrap">
<div class="results-head"><div><div class="kicker" id="seasonLabel">SEASON</div><h2>Match Archive</h2></div><select id="yearSelect" class="year-select"></select></div>
<div id="status" class="status">試合結果を読み込んでいます…</div>
<div id="app" hidden><div id="tabs" class="tabs"></div><div id="panels"></div></div>
</div></section>
</main>
<footer class="site-footer"><div class="container"><div class="copyright">© YOKOHAMA CITY UNIVERSITY MEDICAL TENNIS CLUB</div></div></footer>
<script src="site.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const DATA_FILE='results.xlsx';
const teamLabels={MEN:'MEN',WOMEN:'WOMEN',NURSING:'NURSING',OBOG:'OBOG'};
const categoryLabels={League:'リーグ戦',Toitai:'東医体',Practice:'練習試合',Individual:'秋季個人戦',OBOG:'OBOG戦'};
const categoryOrder={League:1,Toitai:2,Individual:3,Practice:4,OBOG:5};
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function parseDate(v){if(v instanceof Date&&!isNaN(v))return v;if(typeof v==='number'){const d=XLSX.SSF.parse_date_code(v);return d?new Date(d.y,d.m-1,d.d):null}const s=String(v??'');const m=s.match(/(\d{4})[\/.\-](\d{1,2})[\/.\-](\d{1,2})/);return m?new Date(+m[1],+m[2]-1,+m[3]):null}
function displayDate(v){if(typeof v==='string'&&v.includes(','))return v;const d=parseDate(v);return d?`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`:String(v??'')}
function yearOf(v){const d=parseDate(v);return d?d.getFullYear():null}
function stateClass(v){const s=String(v??'').toUpperCase();return s==='WIN'?'win':s==='LOSS'?'loss':s==='SUS'?'sus':'blank'}
function resultText(v){return String(v??'').toUpperCase()}
function matchUrl(m){return `match.html?id=${encodeURIComponent(m.MatchID)}`}
function youtubeVideoId(url){if(!url)return'';try{const u=new URL(String(url));if(u.hostname==='youtu.be')return u.pathname.slice(1).split('/')[0];if(u.hostname.includes('youtube.com')&&u.pathname==='/watch')return u.searchParams.get('v')||'';if(u.hostname.includes('youtube.com')&&u.pathname.startsWith('/shorts/'))return u.pathname.split('/')[2]||''}catch(e){}return''}
function latestOf(rows){return [...rows].sort((a,b)=>(parseDate(b.Date)?.getTime()||0)-(parseDate(a.Date)?.getTime()||0))[0]}
function videoBox(m){if(!m.Youtube)return `<div class="thumb"><div class="no-video">NO HIGHLIGHT VIDEO</div></div>`;const vid=youtubeVideoId(m.Youtube);if(vid)return `<a class="thumb" href="${esc(m.Youtube)}" target="_blank" rel="noopener"><img src="https://img.youtube.com/vi/${esc(vid)}/hqdefault.jpg" alt=""><div class="thumb-overlay"><div class="play">▶</div><div class="thumb-cap">WATCH HIGHLIGHTS →</div></div></a>`;return `<a class="thumb" href="${esc(m.Youtube)}" target="_blank" rel="noopener"><div class="thumb-overlay"><div class="play">▶</div><div class="thumb-cap">OPEN YOUTUBE →</div></div></a>`}
function latestCard(m){return `<article class="latest"><div class="latest-left"><div class="latest-meta">LATEST RESULT · ${esc(categoryLabels[m.Category]||m.Category)} · ${esc(displayDate(m.Date))}</div><div class="latest-title">${esc(m.Round||'')}</div><div class="latest-score">${esc(m['Home score'])} – ${esc(m['Away Score'])}</div><div class="latest-vs">${esc(m.Home)} <span style="opacity:.55">vs</span> ${esc(m.Away)}</div><div class="latest-foot"><a href="${matchUrl(m)}">FULL RESULT →</a></div></div><div class="latest-right"><span class="badge ${stateClass(m.Result)}">${esc(resultText(m.Result))}</span>${videoBox(m)}</div></article>`}
function card(m){const yt=m.Youtube?`<a class="yt" href="${esc(m.Youtube)}" target="_blank" rel="noopener">▶ <span>HIGHLIGHTS</span></a>`:'<span></span>';return `<article class="card"><div class="card-top"><span>${esc(displayDate(m.Date))}</span><span class="card-type">${esc(categoryLabels[m.Category]||m.Category)}</span></div><div class="card-round">${esc(m.Round||'')}</div><div class="card-main"><div><div class="card-home">${esc(m.Home)}</div><div class="card-away">vs ${esc(m.Away)}</div></div><div class="card-score">${esc(m['Home score'])}–${esc(m['Away Score'])}</div></div><div class="card-foot"><span class="state ${stateClass(m.Result)}">${esc(resultText(m.Result))}</span>${yt}<a class="full" href="${matchUrl(m)}">FULL RESULT →</a></div></article>`}
function practiceSection(rows){return `<section class="section-block"><div class="section-head"><small>PRACTICE</small><h3>練習試合</h3></div>${rows.map(m=>`<div class="practice-row"><span class="practice-date">${esc(displayDate(m.Date))}</span><a class="practice-opp" href="${matchUrl(m)}">${esc(m.Away)}</a><strong class="practice-score">${esc(m['Home score'])}–${esc(m['Away Score'])}</strong><span class="state ${stateClass(m.Result)}">${esc(resultText(m.Result))}</span>${m.Youtube?`<a class="yt" href="${esc(m.Youtube)}" target="_blank" rel="noopener">▶</a>`:'<span></span>'}</div>`).join('')}</section>`}
function normalSection(rows,cat){if(!rows.length)return'';if(cat==='Practice')return practiceSection(rows);return `<section class="section-block"><div class="section-head"><small>${esc(cat.toUpperCase())}</small><h3>${esc(categoryLabels[cat]||cat)}</h3></div><div class="cards ${cat==='OBOG'?'obog-grid':''}">${rows.map(card).join('')}</div></section>`}
function render(data){const years=[...new Set(data.map(x=>yearOf(x.Date)).filter(Boolean))].sort((a,b)=>b-a);const ysel=document.getElementById('yearSelect');ysel.innerHTML=years.map(y=>`<option value="${y}">${y}</option>`).join('');ysel.onchange=()=>renderYear(data,+ysel.value);renderYear(data,years[0]||new Date().getFullYear())}
function renderYear(data,year){document.getElementById('seasonLabel').textContent=`${year} SEASON`;const rows=data.filter(x=>yearOf(x.Date)===year);const teams=['MEN','WOMEN','NURSING','OBOG'].filter(t=>rows.some(x=>x.Team===t));tabs.innerHTML=teams.map((t,i)=>`<button class="tab ${i===0?'active':''}" data-team="${t}">${teamLabels[t]}</button>`).join('');panels.innerHTML=teams.map((t,i)=>{const r=rows.filter(x=>x.Team===t).sort((a,b)=>(parseDate(b.Date)?.getTime()||0)-(parseDate(a.Date)?.getTime()||0));const cats=[...new Set(r.map(x=>x.Category))].sort((a,b)=>(categoryOrder[a]||99)-(categoryOrder[b]||99));return `<div class="panel ${i===0?'active':''}" id="panel-${t}">${r.length?latestCard(latestOf(r)):''}${cats.map(c=>normalSection(r.filter(x=>x.Category===c),c)).join('')}</div>`}).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(`panel-${b.dataset.team}`).classList.add('active')});status.hidden=true;app.hidden=false}
(async()=>{try{const res=await fetch(DATA_FILE,{cache:'no-store'});if(!res.ok)throw new Error('fetch');const wb=XLSX.read(await res.arrayBuffer(),{type:'array',cellDates:true});const ws=wb.Sheets['Sheet1'];if(!ws)throw new Error('Sheet1');const rows=XLSX.utils.sheet_to_json(ws,{defval:'',raw:true}).filter(x=>x.MatchID);render(rows)}catch(e){status.innerHTML='results.xlsx を読み込めませんでした。<br>Live Serverで開いているか、results.html と results.xlsx が同じフォルダにあるか確認してください。'}})();
</script>
</body></html>
