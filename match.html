<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MATCH RESULT | 横浜市立大学医学部硬式テニス部 OBOG会</title>
<link rel="stylesheet" href="style.css">
<style>
.match-page{--navy:#07192d;--gold:#c6a15b;--line:#dce2e8;--muted:#697586}
.match-summary{
  background:linear-gradient(120deg,#061426,#0b2b50 68%,#123d5d);color:#fff;padding:40px;margin-bottom:38px
}
.match-meta{font-size:11px;letter-spacing:.15em;color:#c5d2df;font-weight:800}
.match-scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:28px;margin-top:38px}
.match-school{font-size:clamp(22px,3vw,38px);font-weight:800;line-height:1.25}.match-school.away{text-align:right}
.match-total{font-size:clamp(58px,8vw,100px);font-weight:900;letter-spacing:-.06em;white-space:nowrap}.match-total span{font-size:.35em;opacity:.55;margin:0 12px}
.breakdown{display:flex;gap:22px;justify-content:center;margin-top:26px;color:#d1d9e2;font-size:13px;font-weight:700}
.detail-section{margin-top:36px}
.detail-section h2{font-size:30px;margin:0 0 16px}
.detail-table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line)}
.detail-table th,.detail-table td{padding:16px 14px;border-bottom:1px solid var(--line);text-align:left}
.detail-table th{font-size:10px;letter-spacing:.12em;color:var(--muted);background:#f5f7fa}
.detail-table td.result{width:58px;font-weight:900}.detail-table td.position{width:62px;font-weight:800}
.detail-table td.score{font-weight:800}
.detail-table tr:last-child td{border-bottom:0}
.result-win{color:#aa8032}.result-loss{color:#788493}.result-sus{color:#9b7b3e}
.back{display:inline-block;margin-top:28px;color:#07192d;text-decoration:none;font-weight:800}
.video-box{margin-top:26px}
.video-box a{display:inline-flex;align-items:center;gap:9px;padding:10px 14px;background:#fff;color:#07192d;border:1px solid rgba(255,255,255,.32);text-decoration:none;font-size:10px;font-weight:900;letter-spacing:.12em}
.video-box a svg{width:19px;height:19px;fill:currentColor}
.error{padding:30px;border:1px solid #dcc;background:#fff;color:#755}
@media(max-width:700px){
  .match-scoreboard{grid-template-columns:1fr;text-align:left}.match-school.away{text-align:left}.match-total{font-size:64px}
  .detail-table{font-size:13px}.detail-table th,.detail-table td{padding:12px 9px}
}
</style>
</head>
<body class="match-page">
<header class="site-header scrolled"><div class="container nav">
  <a class="brand" href="index.html"><small>横浜市立大学</small><strong>医学部硬式テニス部 OBOG会</strong></a>
  <button class="menu-toggle">☰</button>
  <nav class="menu"><a href="index.html">HOME</a><a href="about.html">ABOUT</a><a href="members.html">MEMBERS</a><a class="active" href="results.html">RESULTS</a><a href="schedule.html">SCHEDULE</a><a href="history.html">HISTORY</a><a href="contact.html">CONTACT</a></nav>
</div></header>
<main>
<section class="page-hero"><div class="container"><div class="kicker">FULL RESULT</div><h1>MATCH</h1><p>Excelの詳細シートから自動表示します。</p></div></section>
<section class="section"><div class="container"><div id="app"><div class="result-loading">試合詳細を読み込んでいます…</div></div></div></section>
</main>
<footer class="site-footer"><div class="container"><div class="copyright">© YOKOHAMA CITY UNIVERSITY MEDICAL TENNIS CLUB</div></div></footer>
<script src="site.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const DATA_FILE="results.xlsx";
const params=new URLSearchParams(location.search), MATCH_ID=params.get("id")||"";
const teamSheet={MEN:"男子部 2026",WOMEN:"女子部 2026",NURSING:"看護部 2026"};
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function excelDateToJS(v){
  if(v instanceof Date&&!isNaN(v))return v;
  if(typeof v==="number"){const d=XLSX.SSF.parse_date_code(v);return d?new Date(d.y,d.m-1,d.d):null}
  const s=String(v??"").trim(), a=s.match(/(\d{4})[\/.-](\d{1,2})[\/.-](\d{1,2})/g);
  if(a&&a.length){const p=a[a.length-1].match(/(\d{4})[\/.-](\d{1,2})[\/.-](\d{1,2})/);return new Date(+p[1],+p[2]-1,+p[3])}
  return null
}
function displayDate(v){const d=excelDateToJS(v);return d?`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`:String(v??"")}
function yId(url){if(!url)return"";try{const u=new URL(String(url).trim());if(u.hostname==="youtu.be")return u.pathname.replace("/","").split("/")[0];if(u.hostname.includes("youtube.com")){if(u.pathname==="/watch")return u.searchParams.get("v")||"";if(u.pathname.startsWith("/shorts/"))return u.pathname.split("/")[2]||""}}catch(e){}return""}
function yIcon(){return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.6 7.2a2.9 2.9 0 0 0-2-2C17.8 4.7 12 4.7 12 4.7s-5.8 0-7.6.5a2.9 2.9 0 0 0-2 2A30 30 0 0 0 2 12a30 30 0 0 0 .4 4.8 2.9 2.9 0 0 0 2 2c1.8.5 7.6.5 7.6.5s5.8 0 7.6-.5a2.9 2.9 0 0 0 2-2A30 30 0 0 0 22 12a30 30 0 0 0-.4-4.8ZM10 15.4V8.6l5.9 3.4L10 15.4Z"/></svg>`}
function resultClass(x){x=String(x||"").toUpperCase();return x==="WIN"?"result-win":x==="LOSS"?"result-loss":"result-sus"}
function detailFromSummary(ws, summary){
  const a = XLSX.utils.sheet_to_json(ws,{header:1,defval:""});

  // Excelの概要シートにある対戦校を、詳細シート内から直接探す。
  // 同じ対戦校が複数回ある場合は日付（M/D）で絞り込む。
  const candidates = [];
  for(let r=0;r<a.length;r++){
    for(const oppCol of [5,11]){
      const cell = String(a[r]?.[oppCol] || "").trim();
      if(cell && cell === String(summary.opponent || "").trim()){
        const start = oppCol - 4;   // B列またはH列がブロック先頭
        const title = String(a[r-1]?.[start] || "").trim();

        let dateScore = 0;
        const rawDate = String(summary.date ?? "");
        const tokens = rawDate.match(/(?:\d{4}\/)?(\d{1,2})\/(\d{1,2})/g) || [];
        for(const t of tokens){
          const md = t.replace(/^\d{4}\//,"");
          if(title.includes(md)) dateScore += 10;
        }

        // Excel日付シリアル/Date型の場合
        const d = excelDateToJS(summary.date);
        if(d){
          const md = `${d.getMonth()+1}/${d.getDate()}`;
          if(title.includes(md)) dateScore += 10;
        }

        // Roundも一致すれば加点
        const round = String(summary.round || "").trim();
        if(round && title.includes(round)) dateScore += 3;

        candidates.push({r, start, oppCol, title, score:dateScore});
      }
    }
  }

  if(!candidates.length) return null;
  candidates.sort((x,y)=>y.score-x.score);
  const hit = candidates[0];

  const totalRow = hit.r + 1;
  const singlesBreakRow = hit.r + 2;
  const firstDetailRow = hit.r + 3;

  const lines = [];
  for(let rr=firstDetailRow; rr<a.length; rr++){
    const pos = String(a[rr]?.[hit.start] || "").trim();
    if(!/^[DS]\d+$/i.test(pos)) break;
    lines.push({
      pos,
      result:String(a[rr]?.[hit.start+1] || "").trim(),
      ycu:String(a[rr]?.[hit.start+2] || "").trim(),
      score:String(a[rr]?.[hit.start+3] || "").trim(),
      opp:String(a[rr]?.[hit.oppCol] || "").trim()
    });
  }

  return {
    title: hit.title,
    opponent: String(a[hit.r]?.[hit.oppCol] || "").trim(),
    ycuTotal: a[totalRow]?.[hit.start+2] ?? "",
    oppTotal: a[totalRow]?.[hit.oppCol] ?? "",
    dBreak: String(a[totalRow]?.[hit.start+3] || "").trim(),
    sBreak: String(a[singlesBreakRow]?.[hit.start+3] || "").trim(),
    lines
  };
}
function render(summary,detail){
  const dBreak=detail?.dBreak||"", sBreak=detail?.sBreak||"";
  const ds=[dBreak,sBreak].filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join("");
  const video=summary.youtube?`<div class="video-box"><a href="${esc(summary.youtube)}" target="_blank" rel="noopener">${yIcon()} HIGHLIGHTS</a></div>`:"";
  const groups={D:[],S:[]};
  (detail?.lines||[]).forEach(x=>groups[x.pos[0].toUpperCase()]?.push(x));
  const table=(name,rows)=>rows.length?`<section class="detail-section"><h2>${name}</h2><div style="overflow-x:auto"><table class="detail-table"><thead><tr><th>POS.</th><th></th><th>YCU</th><th>SCORE</th><th>OPPONENT</th></tr></thead><tbody>${rows.map(x=>`<tr><td class="position">${esc(x.pos)}</td><td class="result ${x.result.includes("○")||x.result.includes("〇")?"result-win":x.result.includes("●")?"result-loss":"result-sus"}">${esc(x.result||"—")}</td><td>${esc(x.ycu)}</td><td class="score">${esc(x.score)}</td><td>${esc(x.opp)}</td></tr>`).join("")}</tbody></table></div></section>`:"";
  const detailWarning = detail ? "" : `<div class="error" style="margin-bottom:24px">詳細スコアをExcel内で照合できませんでした。MatchID・対戦校・日付を確認してください。</div>`;
  document.getElementById("app").innerHTML= detailWarning + `
    <article class="match-summary">
      <div class="match-meta">${esc(summary.category)} / ${esc(summary.round)} / ${esc(displayDate(summary.date))}</div>
      <div class="match-scoreboard">
        <div class="match-school">横浜市立大学</div>
        <div class="match-total">${esc(summary.ycu)}<span>—</span>${esc(summary.opp)}</div>
        <div class="match-school away">${esc(summary.opponent)}</div>
      </div>
      <div class="breakdown">${ds}</div>${video}
    </article>
    ${table("DOUBLES",groups.D)}
    ${table("SINGLES",groups.S)}
    <a class="back" href="results.html">← RESULTSへ戻る</a>`;
}
function process(buf){
  const wb=XLSX.read(buf,{type:"array",cellDates:true});
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
  const summaries=rows.filter(r=>r.MatchID).map(r=>({id:String(r.MatchID).trim(),team:String(r.Team||"").trim().toUpperCase(),date:r.Date,category:String(r.Category||""),round:String(r.Round||""),opponent:String(r.Opponent||""),ycu:r.YCU,opp:r.Opp,result:String(r.Result||""),youtube:String(r.Youtube||r.YouTube||"").trim()}));
  const summary=summaries.find(x=>x.id===MATCH_ID);
  if(!summary){document.getElementById("app").innerHTML='<div class="error">該当するMatchIDが見つかりません。</div>';return}
  const sname=teamSheet[summary.team];
  const detail=sname&&wb.Sheets[sname] ? detailFromSummary(wb.Sheets[sname],summary) : null;
  render(summary,detail);
}
async function start(){
  if(!MATCH_ID){document.getElementById("app").innerHTML='<div class="error">MatchIDが指定されていません。</div>';return}
  try{const r=await fetch(DATA_FILE,{cache:"no-store"});if(!r.ok)throw 0;process(await r.arrayBuffer())}
  catch(e){
    document.getElementById("app").innerHTML='<div class="error">ローカル確認ではExcelの自動読込ができない場合があります。下から results.xlsx を選択してください。<br><br><input type="file" id="pick" accept=".xlsx,.xls"></div>';
    document.getElementById("pick").onchange=async e=>{const f=e.target.files[0];if(f)process(await f.arrayBuffer())}
  }
}
start();
</script>
</body>
</html>
